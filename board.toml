# Board description of the Redmi K30 5G (picasso, SM7250), read by the unixnu build driver.
# Minimal skeleton to build the UniXNU UEFI firmware. Kernel/IPSW/UserData sections are
# placeholders to be filled during kernel bring-up.

[board]
name = "picasso"
soc = "SM7250"
description = "Redmi K30 5G"
kit = "picasso"

# Target OS image. PLACEHOLDER   select an IPSW whose ARM version is compatible with
# SM7250 (ARMv8.2 / Cortex-A76). Only needed for the kernel step, not for firmware.
[ipsw]
# Same unchanged iPad7,1 iPadOS 17.7.11 image uke (SM7675) and sheng (SM8550) use.
# SM7250 (ARMv8.2 / Cortex-A76) is instruction-compatible with this kernel source.
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]

# UserData partition geometry (GPT entry "userdata" of LUN 0). PLACEHOLDER.
# The silenzio111 branch measured first_lba = 0x200000, last_lba = 0x3A00000 on this
# board; those values stay unverified here and the kernel/payload steps do not read
# them, so the safe placeholder is kept until "unixnu build userdata" is brought up.
[userdata]
first_lba = 0x0
last_lba = 0x0
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Kernel configuration. PLACEHOLDER for kernel bring-up.
[kernel]
defconfig = "picasso_defconfig"
# First-console archives: only what the minimal picasso_defconfig selects
# (corecrypto, ArmDTPlatform, ArmCpu, arch timer). UFS / VirtIO / display /
# Adreno are added in later stages once the platform reaches the console:
# configs/picasso_platform_defconfig lists the stage-6 draft, and its archives
# would be "build-libpthread-kernel.py", "build-arm-driver.py NativeUfs" and
# "build-arm-driver.py NativeAdreno" appended below.
archives = [
  "build-native-aes-bindings.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  # Stage 6: the UFS controller driver. Its board constants (GccUfs.h) carry
  # the SM7250 physical windows; the ADT ufshc/ufsphy nodes only match classes.
  "build-arm-driver.py NativeUfs",
  # r84: publish the original ApplePMGRNub before AMFI asks for it. The
  # prelinked ApplePMGR component is shared with sheng; this archive adds only
  # the audited lifecycle/publication shim.
  "build-sheng-platform-power.py",
  # r63: typed RAM-block backend for the scratch Data seed (DATA_MOUNT).
  "build-arm-driver.py NativeRamBlock",
  # The archive is link-only: it removes the class initializer and supplies
  # guarded reference stubs. It never enters attach, allocation or publish.
  "build-native-legacy-display.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = ""
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOHIDFamily",
  # Original IOBSD-matched IOSurfaceRoot, required by graphics/media clients.
  "com.apple.iokit.IOSurface",
  # M4: the owned NativeLegacyDisplay subclass calls the unchanged
  # IOMobileFramebufferLegacy implementation by its qualified original
  # addresses. Keep that parent (and its IOSurface dependency closure) in the
  # same prelinked layout as the audited candidate before entering runtime.
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kec.pthread",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  # r86: launchd's container initialization calls into the real Sandbox
  # policy. Without this component the MACF lookup returns ENOPOLICY and
  # sandbox_get_container_expected() aborts pid 1.
  "com.apple.security.sandbox",
]

# Firmware step: build the picasso Mu-Silicium UEFI firmware via unixnu.
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 1
# The ABL loads kernel + ramdisk into one buffer that starts at abl_base
# (0xB4513000 on this device, derived from the observed initrd address) and ends
# at 0xB7E00000, so the whole payload window is about 57 MiB. With the default
# ramdisk_offset of 0x1000000 the ramdisk starts at 0xB5513000 and only 42.6 MiB
# fit, which truncated the 120 MiB payload: the FAT volume claimed 120 MiB while
# only the first 42.9 MiB were in memory, and FatPkg faulted at 0xB7BFE000.
# 0x200000 puts the ramdisk right after the ~2.1 MiB kernel slot, leaving 54.8 MiB.
ramdisk_offset = 0x200000
[firmware]
config = "picasso"                   # Resources/Configs/picasso.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/picassoPkg/picasso.dsc"
fd = "Build/picassoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
# Openssl submodule is required by Silicon/Silicium OpensslPkg (same as sheng and the
# stock picasso DeviceBuild.py RequiredSubmodules).
submodules = ["Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# Full set aligned with sheng so SecureBootHandler.c and other #if-gated code compile
# (ENABLE_SECUREBOOT must be 0/1, not empty, or '#if ENABLE_SECUREBOOT == 1' is a syntax error).
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "picasso"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "picasso-research"

# Payload: a FAT volume with UniXNU config + kernel + ADT. Loader (DarwinBoot) is in the firmware.
[payload]
volume = "PICASSOESP"
# The embedded 128-KiB-record manifests add about 2.2 MiB to kernel.macho.
# The 226 MiB carrier with a 128 MiB Data seed faults in ArmCpuDxe before XNU.
# Keep the proven 128 MiB carrier; larger mutable storage must come from a
# different backend rather than inflating the early boot ramdisk.
size_mib = 128
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
]
loader = "firmware"
title = "Boot"
dram_size = "0x80000000"
# serial=3 was dead weight here and could stall early boot: pe_serial.c only
# registers PI3_UART, APPLE_UART, DOCKCHANNEL_UART and VMAPPLE_UART. SM7250 is a
# Qualcomm GENI UART, so serial_init() returns 0 and PE_kputc falls back to
# console_write_unbuffered -> vcputc_options, which is a no-op until the IOKit
# video console binds the framebuffer. Asking for serial output therefore bought
# nothing and left the boot without a console. debug=0x14e keeps DB_KPRT (0x8),
# so kprintf is still enabled; the flags are 0x2 and 0x4 (NMI) plus 0x40 (ARP)
# and 0x100 (obsolete), none of which halt early.
# Also pin the platform explicitly: cpus=1 avoids spinning up seven secondary
# cores before the platform expert has an interrupt controller.
kernel_args = [
  "-v",
  "debug=0x14e",
  "cpus=1",
  # Drive the UFS controller. native-ufs-root=1 is the sheng production
  # path but upstream's payload guard demands the sheng PMGR shim
  # (sheng-pmgr=2 + _sheng_pmgr_run linked). native-ufs-probe=12 runs the
  # SAME startRoot() hardware bring-up from the root-device personality and
  # panics with the full media report (GPT/userdata geometry) after a
  # r49 (single variable vs r48: probe back on). probe=12 runs startRoot()
  # bring-up (IODelay polls) from a deferred thread, publishes on success,
  # panics with the media report only on failure. r48 proved bare start()
  # rejects everything, so the probe path is the item-3 vehicle.
  "native-ufs-probe=12",
  # r84: AMFI's unchanged bootstrap waits for ApplePMGRNub. Without the
  # audited provider publication it reaches launchd and panics "AMFI: No PMGR?".
  "sheng-pmgr=2",
  # r13: delay UFS root start to 150 s (single variable vs r12). r11/r12 died
  # r48: start-delay removed (default 5 s deferred start).
  # IOSleep does not reliably make progress this early with cpus=1. The
  # r48: M1 item 3 (single variable vs r47). Hypothesis: the UFS hang was
  # IODelay-via-WFE with no timer IRQ to wake it; with the timer live,
  # IODelay(2) polling should progress. 0 restores the production path.
  "native-ufs-delay-yield=0",
  # r55 (single variable vs r54): shrink deferred wait 5s->1s so the
  # blocking deadline falls inside the sleep-test blocking window
  # (deferred starts ~93ms before sleep iter0; sleep spans ~1.9s).
  # r54 proved the timer fires (IRQ 833->853) but the 5s deadline lands
  # ~1.8s into the non-blocking 60s control window where the boot thread
  # never yields, so no thread is ever scheduled. 1s keeps blocking mode
  # (delay-yield stays 0) and tests the starvation hypothesis.
  "native-ufs-start-delay=1",
  # r19 single-variable vs r15: drop native-ufs-poll-delay-us (restore the
  # default 2 us IODelay between UFS polls, as in v5 which never set it).
  # Diagnostics already reverted to 0. If the 38 s death persists,
  # poll-delay is exonerated and only the kernel build + control/watchdog
  # magnitudes remain.
  "native-ufs-diagnostics=0",
  # The 64 MiB volatile seed fills before launchd completes. Use the qualified
  # 8 GiB packed seed and write changed pages through the NativeUfs store.
  "sheng-data-persist=2",
  # r12: probe removed (single variable vs r11). The read-only snapshot runs
  # after CDC handoff and touches GICR/SMMU MMIO; r11 died at ~19 s with it,
  # v5 (no probe) survives. If r12 survives past 19 s, the probe is the
  # killer and M1 stage A must be reworked, not just lengthened.
  # Diagnostic-only: keep console output flowing when an early kernel path
  # logs with interrupts disabled. Without this XNU panics at
  # serial_console.c:175 before CDC can deliver the surrounding context.
  "nointr_consio=1",
  # IOLog has a separate interrupt-context assertion in IOLib.cpp. This
  # diagnostic-only escape hatch lets those messages reach the CDC console.
  "nointr_iolog=1",
  # IOKit matching trace: kIOLogMatch(0x10) | kIOLogProbe(0x2) |
  # kIOLogConfig(0x20) | kIOLogCatalogue(0x200). Three silent runs in a row
  # (root, probe=12 variants) mean start() is never reached; this shows
  # whether the personalities registered, whether ArmDTPlatform matched the
  # root nub, and whether NativeUfs::probe was called at all. The log is
  # long -- capture it in screen photos in sequence.
  "io=0x232",
  # USB console (usb branch): 1 = state probe only, 2 = run the CDC-ACM
  # console streaming (DWC3 device mode; the PC sees a serial port carrying
  # the last 256 KiB of console text and then live output).
  "picasso_usb=2",
  # The pre-existing apps-SMMU route only matches after the USB console
  # driver installs its guarded plan/apply bypass for stream 0xe0. Without
  # this, the read-only guard sees zero matches and deliberately leaves the
  # controller untouched.
  "picasso_usb_smmu=6",
  # Let the existing background poller service CDC traffic and watchdog pets.
  "picasso_usb_hold=0",
  # r10 showed CDC enumerates ~70 s after boot on the v5 image, so the
  # earlier 60 s window risked closing before the tty attaches. r11 uses
  # observation-scale deadlines (deadline family is the single variable vs
  # r20 deadline family vs r15: restore v5 magnitudes (control 60 s, watchdog
  # default 15 s) as one family. If the 38 s death persists inside the 60 s
  # window, the deadline family is exonerated and only the kernel build
  # remains as the v5-vs-r delta.
  # r56 (single variable vs r55): control window 60s->180s for more
  # operating space per user request. Deferred delay stays 1s (deadline
  # inside sleep-test window), keep=1 unchanged, blocking mode unchanged.
  # r57 (single variable vs r56): control window 180s->600s for more
  # operating space per user request (10 min synchronous window).
  # Deferred delay=1, keep=1, blocking mode unchanged.
  # r59 (single variable vs r58): control window 120s->30s. User requires
  # actual wall wait ~= 3 min; at measured ~6.2x dilation 30s nominal ~=
  # 3.1 min wall. Deferred UFS work (publish seen pre-t=10000 on r58)
  # fits with wide margin; ticks still land (t=10000/20000/30000).
  # r58 (single variable vs r57): control window 600s->120s. r57 proved the
  # window dilates ~6.2x wall (1ms nominal ~= 6.2ms wall), so 600s nominal
  # ~= 62 min wall and post-window mount evidence stays out of reach in one
  # attended run. 120s nominal ~= 13 min wall keeps generous operating space
  # while letting the window end inside a single capture run.
  # Keep the synchronous control window short; later CDC servicing belongs to
  # the background poller once the timer path is healthy.
  "picasso_usb_control_ms=15000",
  # r14: control reset removed entirely (single variable vs r13). v5 never had
  # it and survives; r11-r13 (which all died ~19 s) all had it. If the reset
  # path misfires early, removing it should let the boot pass 19 s. Watchdog
  # (240 s) remains the backstop; recovery is manual if it does not bite.
  # Arm the APSS watchdog before USB, SMMU and UFS work. If enumeration or a
  # later kernel path hangs, the missing service resets the board back to the
  # Fastboot reason armed in IMEM.
  # r89 (single variable vs r88): restore the APSS watchdog while keeping the
  # provider path free of unverified graphics loading. This verifies automatic
  # recovery on early hangs before graphics is enabled again.
  "picasso_usb_watchdog=1",
  # The APSS counter is 20-bit: 32 s is the hardware maximum. The 60 s host
  # deadman below keeps petting while the host is alive and then forces a bite.
  "picasso_usb_watchdog_ms=32000",
  # Once the CDC host is ready, a parsed command refreshes this deadline.
  # With no host command for 60 s, the service path stops petting and forces
  # a Fastboot reset.
  "picasso_usb_host_timeout_ms=60000",
  # Before CDC is ready, allow enough time for slow enumeration while still
  # bounding complete enumeration failure. Once this expires, stop petting
  # the hardware watchdog and return to Fastboot.
  "picasso_usb_host_boot_grace_ms=120000",
  # Petting is host-gated: CDC/host silence stops the service path from
  # refreshing the watchdog, so an unattended boot returns to Fastboot.
  # The hardware watchdog bite is the proven Fastboot reset path. IMEM is
  # preset before the bite; PSHOLD remains the final panic fallback.
  "picasso_usb_reset=watchdog",
  # r22 (M1 stage A, single variable vs r21): read-only GIC/timer snapshot
  # inside the synchronous control window, before the 60 s busy loop. Prints
  # GICD/GICR/ICC/CNTFRQ/CNTV state + snapshot complete (read-only). No MMIO
  # writes, no IRQ enable, no timer bring-up.
  "native-timer-probe=1",
  # r25 (M1 stage C, single variable vs r24): minimal closed loop on INTID 19
  # (r24 proved it is the live line). DAIF.I set: Group-1 + enableGic + arm;
  # sample pending masked; unmask briefly and count IRQs; re-mask, disable
  # source, report. Replaces stageb2 (same pet'd-loop pattern, ~16 s).
  "native-timer-selftest=1",
  # r31: bypass rtclock_intr in the timer IRQ handler (count + EOIR +
  # manual TVAL re-arm) to prove take/EOIR/re-fire without the early
  # rtclock hang. Gated in ArmCpu::interrupt, default off.
  "native-timer-no-rtclock=1",
  # r52 (single variable vs r51): keep live timer after selftest so the
  # deferred UFS 5 s blocking wait can wake (r51 post=0 proved End killed it).
  "native-timer-keep=1",
  # M2 stage A: after CDC is live, map the GOP framebuffer retained in
  # PE_Video and paint an eight-bar diagnostic page. Read-only with respect to
  # storage; no driver or virtual-memory metadata is changed.
  "picasso-fb-probe=0",
  # M4 r2: exercise the normal OSKext entry point for the original MobileGraphics
  # family now that it is prelinked at its audited addresses. No Legacy display
  # object is allocated or published yet.
  "offline-mobile-graphics-load=1",
  # M6: run metaclass registration, allocation, init and release for the owned
  # Legacy subclass. It is not attached to a nub, published or used for scanout.
  "offline-legacy-register=1",
  # CPU/GOP display: use the retained ABL framebuffer as the real legacy
  # display provider. The original family owns the client/swap lifecycle; the
  # backend only copies completed BGRA surfaces and releases the text console.
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-phase=4",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  # State queries only for unprotected RAM Data; no keybag or key operations.
  "picasso-aks-state=1",
  "sheng-vsync=60",
]
# Stage-5 blind-spot instrumentation (docs/zh/guide/debugging.md 颜色条):
# scripts/patch-xnu-entry-probe.py (ported from UniXNU-sheng; it adapts itself
# to this kernel via the symbol table) paints a blue bar at the kernel entry,
# a magenta bar just before the MMU comes on, and reboots the device via PSCI
# SYSTEM_RESET entry_probe_reset_delay seconds after the MMU is enabled --
# a spontaneous reboot after that delay is the signal that start.s completed.
# panic_screen redirects panic() to a renderer that draws on the kernel's own
# framebuffer mapping. The Picasso CDC console captures the panic stream
# synchronously, so keep this disabled while CDC is the evidence path.
# Bisect deeper with entry_probe_reset_after (one call per run; payload.py keys
# map to the script's --reset-after/--in/--occurrence options).
# Bisect log (2026-10-24), one probe per run; ~6 s reboot = the call completed:
#   run 1  after-MMU        -> reboot : start.s complete (genuine: cave 16-aligned)
#   run 2  _arm_vm_init     -> VOID   : tight-packing bug (below) made cave4 bl
#   run 3  _PE_create_console -> VOID   : land at callee-4 (previous function tail)
#   run 4  _PE_init_platform #2 -> hang + panic text: the miswired bl landed on
#         PE_slide_devicetree's `bl .cold` tail = exactly the observed
#         "pe_init.c:418 Assertion failed: PE_state.initialized". The text
#         itself proves PE_create_console/PE_init_printf/cpu_machine_idle_init
#         all completed (those calls were untouched).
#   run 5  same target, caves 16-aligned -> ~6 s reboot: the real second
#         PE_init_platform (pe_arm_init_interrupts, GIC MMIO 0x17A00000)
#         completed. Transitively proves arm_vm_init, PE_create_console,
#         PE_init_printf (runs 2/3 were void; the flow covers them).
#         panic screen now reports lr=/PEini=/fb= and mirrors the message
#         to the /pram region: dump-picasso-panic.py --fastboot --paddr 0xB7F00000.
#   run 6  _fiq_context_init #1 -> ~6 s reboot: ml_map_cpu_pio, cpu_timebase_init,
#         kptimer_curcpu_up, PE_init_cpu all complete; arm_init is at its tail.
#   run 7  _vm_mem_bootstrap in _kernel_bootstrap -> ~6 s reboot, no text:
#         kernel_bootstrap runs and vm_mem_bootstrap completes. The missing
#         version line is BY DESIGN: printf goes to vcputc_options, which is
#         gated on gc_enabled, and the screen is only acquired at
#         kPEAcquireScreen (startup.c) -- in _kernel_bootstrap_thread, after
#         PE_init_iokit, the EARLY_BOOT startup phase and spllo(). Early boot
#         is console-less on a board without the display driver, exactly as
#         the earlier note about pe_serial predicted.
#   run 8  _initialize_screen in _kernel_bootstrap_thread -> ~6 s reboot, no
#         wipe: PE_init_iokit (prelinked kexts), EARLY_BOOT and spllo() all
#         passed. No wipe is by design: v_display=1 puts the boot in graphics
#         mode, so kPEAcquireScreen calls gc_enable(FALSE) and the console
#         stays off -- fixed by the vendored DarwinBoot in UniXNU-picasso
#         (drivers/DarwinBoot, v_display = 0 = text console from acquire on).
#   run 9  FREE RUN -> the text console came up and the kernel log scrolled;
#         first visible panic: kern_trustcache.c:477 "amfi interface not
#         available" (lr=_trust_cache_runtime_init.cold.3). The AMFI
#         interface is registered by the early security initializer that
#         emit_prelink records per board; picasso left it empty.
#   run 10 early_security_init: the same pinned iPad7,1 kernelcache as sheng,
#         so the ORIGINAL_VA of AMFI's initializer is identical
#         (0xFFFFFFF005AB4AE0, prelink/kext region below the kernel text);
#         emit_prelink slides it into our coalesced segments (-0x1000000,
#         uniform) and the runtime adds vm_kernel_slide (0 on picasso).
#         (First attempt put the key in [payload] where nothing read it --
#         the panic repeated; fixed in a4a1162 and the panic advanced.)
#   run 11 result: trust_cache_init PASSED (AMFI registered) -- the kernel
#         advanced to pthread_shims.c:318 "pthread kernel extension not
#         loaded". picasso_defconfig keeps CONFIG_XNU_SOURCE_PTHREAD unset,
#         so the pthread shims need the libpthread KEXT from the kernelcache
#         (sheng instead builds pthread from source). The kernelcache's kext
#         is com.apple.kec.pthread (libpthread's kext.xcconfig MODULE_NAME;
#         "com.apple.kec.libpthread" does not exist and fails the closure);
#         its pthread_kext_register call fills the function table.
# r15: enable the panic-screen renderer (single variable vs r14) so the
# ~38 s death freezes with text instead of resetting silently to Fastboot.
# Payload flag only; kernel, args, FD, DTB unchanged.
panic_screen = true

[payload.adt]
tool = "scripts/make-picasso-adt.py"
chip_id = "7250"
# The Data seed is a DBRDISK1 zero-page-packed image. DarwinBoot keeps the
# packed bytes in the handoff; NativeRamBlock expands only nonzero pages and
# backs changed pages with the persistent userdata store. Pass
# owner-data-8g.dbr to "unixnu build payload".
packed_data_ramdisk = true
# Select the authenticated OS APFS volume by its published IOMedia UUID. The
# VerifiedRoot window identity check independently binds this UUID to the
# owner-signed image before the block device is published.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# DarwinBoot requests one contiguous window of this size from the firmware and
# hands it to the kernel as boot_args.memSize. The kernel then builds its physmap
# over exactly that range, so the window has to fit inside a single
# conventional-memory run.
#
# 0x100000000 (4 GiB) cannot fit here. The first DRAM bank is
# 0x80000000..0xBCC00000 (972 MiB) per the device DT, and picassoPkg's
# MemoryMapLib exposes only the "Boot Ramdisk Gap" 0xAD000000..0xBCC00000 as
# SYS_MEM (252 MiB). DarwinBoot still reports success at 4 GiB because
# AllocatePages only records the range as owned, but arm_vm_init() then builds a
# 4 GiB physmap starting at the window base 0xC007C000, which runs past the end
# of real DRAM to 0x1C007C000. Touching that faults with the MMU already on and
# no console bound yet -- the silent hang after the green bar.
#
# 256 MiB is DarwinWindowSizeValid()'s minimum (0x10000000..0x200000000 in 2 MiB
# steps) and fits inside the 252 MiB SYS_MEM run.
owned_memory_size = "0x30000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
unique_chip_id = "required"
